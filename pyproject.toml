[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpaca-paper-analyser"
version = "0.1.0"
description = "Stock analysis and Alpaca paper-trading application (paper mode only)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alpaca-py>=0.33.0,<1.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "streamlit>=1.35",
    "plotly>=5.20",
    "APScheduler>=3.10,<4.0",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
stockbot = "stockbot.cli:main"

[tool.setuptools.packages.find]
include = ["stockbot*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["stockbot"]
omit = ["*/tests/*"]
